<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student boards</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.devtunnels.ms wss://*.devtunnels.ms; frame-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="/rich.css">
<link rel="stylesheet" href="/teacher.css">
</head>
<body>
  <header class="bar">
    <div class="title">
      <h1>Student boards</h1>
      <p id="summary">Connecting…</p>
    </div>
    <div class="tools">
      <button id="onShow" class="pill show" hidden title="Stop showing it"></button>
      <button id="waiting" class="pill warn" hidden></button>
      <div class="seg" id="see" role="radiogroup" aria-label="What students see">
        <button data-follow="1" role="radio">Follow me</button>
        <button data-follow="0" role="radio">Their own boards</button>
      </div>
      <div class="seg small" id="sizes" role="radiogroup" aria-label="Card size">
        <button data-size="s" role="radio" aria-label="Small cards" title="Small cards"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="10" y="3" width="5" height="5" rx="1"/><rect x="17" y="3" width="5" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1"/><rect x="10" y="10" width="5" height="5" rx="1"/><rect x="17" y="10" width="5" height="5" rx="1"/></svg></button>
        <button data-size="m" role="radio" aria-label="Medium cards" title="Medium cards"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></button>
        <button data-size="l" role="radio" aria-label="Large cards" title="Large cards"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/></svg></button>
      </div>
      <button id="close" class="icon-btn" aria-label="Close" title="Close" hidden><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>

  <main>
    <div id="empty" class="empty" hidden>
      <div class="empty-art" aria-hidden="true">🧑‍🎓</div>
      <h2 id="emptyTitle"></h2>
      <p id="emptyText"></p>
    </div>
    <div id="grid" class="grid size-m"></div>
  </main>

  <!-- One student's board, close up (live) -->
  <section id="closer" class="closer" hidden aria-label="Student board">
    <header class="bar closer-bar">
      <button id="back" class="back-btn"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>All boards</button>
      <div class="who"><span id="cDot" class="dot"></span><b id="cName"></b>
        <button id="wToggle" class="write-btn" aria-pressed="false" title="Write on this student's board: they see it straight away"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg><span>Write</span></button>
        <button id="showBtn" class="show-btn" aria-pressed="false" title="Show this board on the whiteboard, for the class"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg><span id="showLabel">Show to class</span></button>
        <label id="showNameBox" class="name-sw" title="Show the student's name with it"><input type="checkbox" id="showName"><span>Show name</span></label>
        <label id="showDrawBox" class="name-sw draw-sw" title="Let them keep drawing on it while it's on show. Off (as it starts): paused, and their screen looks like everyone else's"><input type="checkbox" id="showDraw"><b aria-hidden="true">✏️</b><span>Let them draw</span></label>
      </div>
      <div class="pager">
        <button id="pPrev" class="icon-btn" aria-label="Their previous page"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <span id="pNo">Page 1 of 1</span>
        <button id="pNext" class="icon-btn" aria-label="Their next page"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </header>
    <div id="cMembers" class="members" hidden aria-label="Who's on this team"></div>
    <div class="stage" id="stage">
      <canvas id="page"></canvas>
      <div id="whoPop" class="who-pop" hidden><span id="whoName"></span><button id="whoRemove">Remove this mark</button></div>
      <p id="cWait" class="c-wait">Loading their board…</p>
    </div>
    <div id="wTools" class="wtools" hidden role="toolbar" aria-label="Writing on the board">
      <button data-mark="#e03131" class="sw on" style="--c:#e03131" aria-label="Red pen"></button>
      <button data-mark="#1971c2" class="sw" style="--c:#1971c2" aria-label="Blue pen"></button>
      <button data-mark="#2f9e44" class="sw" style="--c:#2f9e44" aria-label="Green pen"></button>
      <button data-mark="#1f2328" class="sw" style="--c:#1f2328" aria-label="Black pen"></button>
      <span class="sep"></span>
      <button data-mark="hl" class="tool" aria-label="Highlighter" title="Highlighter"><svg viewBox="0 0 24 24"><path d="M9 11l-5 5v4h4l5-5"/><path d="M9 11l6-6 4 4-6 6z"/><path d="M4 20h16"/></svg></button>
      <button data-mark="erase" class="tool" aria-label="Eraser (your marks only)" title="Eraser: takes away your own marks"><svg viewBox="0 0 24 24"><path d="M7 21h10"/><path d="M5 15l9-9 5 5-9 9H8z"/></svg></button>
      <span class="sep"></span>
      <button id="wUndo" class="tool" aria-label="Undo your last mark" title="Undo your last mark"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    </div>
    <button id="sPrev" class="side-btn left" aria-label="Previous student"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span id="sPrevName"></span></button>
    <button id="sNext" class="side-btn right" aria-label="Next student"><span id="sNextName"></span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  </section>

  <script src="/grid-host.js"></script>
  <script src="/rich.js"></script>
  <script src="/engine.js"></script>
  <script src="/teacher.js"></script>
</body>
</html>
